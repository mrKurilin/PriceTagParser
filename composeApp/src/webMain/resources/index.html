<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PriceTagParser</title>
    <link type="text/css" rel="stylesheet" href="styles.css">
</head>
<body>
<!--
  Лёгкий welcome-экран рендерится мгновенно из чистого HTML/CSS.
  Тяжёлый composeApp.js подгружается лениво только по клику «Старт» —
  это убирает «белую страницу» на холодном старте.
-->
<div id="welcome" class="welcome-screen">
    <h1 class="welcome-title">Приветствуем</h1>
    <p class="welcome-subtitle">PriceTagParser — распознавание ценников из фото и видео.</p>
    <button id="welcomeStartButton" class="welcome-button" type="button">Старт</button>
</div>

<div id="composeLoader" class="welcome-loader" hidden>
    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50" role="presentation">
        <circle cx="25" cy="25" r="20" stroke="#ccc" stroke-width="4" fill="none"/>
        <circle cx="25" cy="25" r="20" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"
                stroke-dasharray="90 125">
            <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s"
                              repeatCount="indefinite"/>
        </circle>
    </svg>
    <div id="composeLoaderText" class="welcome-loader-text">Загружаем приложение…</div>
</div>

<div id="composeAppRoot" class="compose-root"></div>

<script type="application/javascript">
    (function () {
        // composeApp.js в compatibility-режиме — это лишь обёртка-выбиралка,
        // которая сама догружает originWasmComposeApp.js + .wasm. Реальный
        // mount Compose может занять несколько секунд после "script onload".
        // Поэтому ждём появления <canvas> внутри #composeAppRoot poll-ом
        // и держим fallback-таймаут на случай ошибок инициализации wasm.
        var READY_POLL_INTERVAL_MS = 150;
        var READY_TIMEOUT_MS = 60_000;

        var startButton = document.getElementById('welcomeStartButton');
        var welcome = document.getElementById('welcome');
        var loader = document.getElementById('composeLoader');
        var loaderText = document.getElementById('composeLoaderText');
        var composeRoot = document.getElementById('composeAppRoot');
        var loaded = false;
        var readyPollId = null;
        var readyTimeoutId = null;

        function stopWatching() {
            if (readyPollId !== null) {
                clearInterval(readyPollId);
                readyPollId = null;
            }
            if (readyTimeoutId !== null) {
                clearTimeout(readyTimeoutId);
                readyTimeoutId = null;
            }
        }

        function onReady() {
            stopWatching();
            loader.hidden = true;
        }

        function onFailure(message) {
            stopWatching();
            loader.hidden = true;
            welcome.hidden = false;
            loaded = false;
            loaderText.textContent = 'Загружаем приложение…';
            alert(message);
        }

        function watchForCompose() {
            readyPollId = setInterval(function () {
                if (composeRoot.querySelector('canvas') !== null) {
                    onReady();
                }
            }, READY_POLL_INTERVAL_MS);

            readyTimeoutId = setTimeout(function () {
                onFailure('Не удалось запустить приложение. Проверьте подключение и попробуйте ещё раз.');
            }, READY_TIMEOUT_MS);
        }

        function startApp() {
            if (loaded) return;
            loaded = true;
            welcome.hidden = true;
            loader.hidden = false;
            loaderText.textContent = 'Загружаем приложение…';

            watchForCompose();

            var script = document.createElement('script');
            script.src = 'composeApp.js';
            script.async = true;
            script.onerror = function () {
                onFailure('Не удалось загрузить приложение. Попробуйте ещё раз.');
            };
            document.body.appendChild(script);
        }

        startButton.addEventListener('click', startApp);
    })();
</script>
</body>
</html>
