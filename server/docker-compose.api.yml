services:
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile.api
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      - APP_ROLE=api
      - SERVER_PORT=8080
      - PRICE_TAG_PARSER_SCRIPT=/app/generate_csv.sh
    volumes:
      - ./files:/app/files
    restart: always
