version: "3"
services:
  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - WEB_DIR=/app/web
      - PRICE_TAG_PARSER_SCRIPT=/app/generate_csv.sh
    volumes:
      - ./files:/app/files
    restart: always
